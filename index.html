<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위플머니 커스텀 분석 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- sql.js (SQLite WebAssembly 엔진) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f7f6; }
        .weple-header { background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%); } /* 위플머니 퍼플 톤 반영 */
    </style>
</head>
<body class="text-gray-800 pb-20">

    <!-- 파일 업로드 화면 -->
    <div id="upload-screen" class="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-purple-50 to-purple-100">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-purple-100">
            <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800 mb-6">위플머니 가계부 분석</h1>
            <label class="block w-full py-4 px-6 bg-purple-500 hover:bg-purple-600 text-white font-semibold rounded-xl cursor-pointer transition shadow-lg hover:shadow-purple-200">
                <i class="fa-solid fa-file-arrow-up mr-2"></i> CSV 또는 백업파일 업로드
                <input type="file" id="file-input" accept=".csv, .sqlite" class="hidden">
            </label>
        </div>
    </div>

    <!-- 메인 대시보드 화면 -->
    <div id="main-dashboard" class="hidden">
        <!-- 상단 위플머니 시그니처 헤더 -->
        <header class="weple-header text-white px-4 pt-4 pb-6 shadow-md">
            <div class="max-w-4xl mx-auto flex justify-between items-center mb-4">
                <div class="flex items-center space-x-3">
                    <button id="prev-month" class="text-white hover:bg-purple-700 p-2 rounded-full transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="current-month-title" class="text-xl font-bold">10월</h2>
                    <button id="next-month" class="text-white hover:bg-purple-700 p-2 rounded-full transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="flex items-center space-x-3">
                    <label class="cursor-pointer bg-purple-700 hover:bg-purple-800 text-xs px-3 py-1.5 rounded-lg transition text-white shadow">
                        <i class="fa-solid fa-sync-alt mr-1"></i> 파일 변경
                        <input type="file" id="file-change" accept=".csv, .sqlite" class="hidden">
                    </label>
                </div>
            </div>

            <!-- 요약 KPI 카드 -->
            <div class="max-w-4xl mx-auto grid grid-cols-2 gap-3 bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/20">
                <div>
                    <span class="text-xs text-purple-100 font-medium">수입</span>
                    <div id="summary-income" class="text-lg font-bold text-emerald-200">0원</div>
                </div>
                <div>
                    <span class="text-xs text-purple-100 font-medium">지출</span>
                    <div id="summary-expense" class="text-lg font-bold text-pink-200">0원</div>
                </div>
            </div>
            <div class="max-w-4xl mx-auto mt-2 px-1 flex justify-between items-center text-xs text-purple-100">
                <span>현금 잔액</span>
                <span id="summary-balance" class="font-bold text-white text-sm">0원</span>
            </div>
        </header>

        <!-- 탭 콘텐츠 영역 -->
        <main class="max-w-4xl mx-auto p-4 -mt-2 space-y-4">
            
            <!-- 1. 캘린더 뷰 -->

                        <span class="text-red-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-500">토</span>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100">
                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-gray-100">
                        <h3 id="selected-date-title" class="font-bold text-gray-700 text-sm">날짜를 선택하세요</h3>
                        <div id="selected-date-summary" class="text-xs text-gray-500">지출 0원</div>
                    </div>
                    <div id="selected-date-transactions" class="space-y-2 max-h-72 overflow-y-auto pr-1">
                        <p class="text-xs text-gray-400 text-center py-6">상단 캘린더에서 날짜를 클릭하면 상세 내역이 표시됩니다.</p>
                    </div>
                </div>
            </section>

            <!-- 2. 통계/인사이트 뷰 -->
            <section id="tab-analytics" class="space-y-4 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <h3 class="font-bold text-gray-700 text-sm mb-3"><i class="fa-solid fa-chart-pie text-purple-500 mr-1.5"></i> 카테고리별 지출 비중</h3>
                        <div class="relative h-64 flex items-center justify-center">
                            <canvas id="categoryPieChart"></canvas>

                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <h3 class="font-bold text-gray-700 text-sm mb-1"><i class="fa-solid fa-chart-bar text-purple-500 mr-1.5"></i> 분류별 지출 순위</h3>
                        <p class="text-[11px] text-gray-400 mb-3">카테고리를 누르면 하위 분류 상세 내역을 볼 수 있습니다.</p>
                        <div class="flex justify-end mb-2 space-x-2">
                            <button onclick="sortCategoryList('desc')" class="text-xs bg-gray-100 hover:bg-purple-50 hover:text-purple-600 px-2.5 py-1 rounded font-medium transition">높은순</button>
                            <button onclick="sortCategoryList('asc')" class="text-xs bg-gray-100 hover:bg-purple-50 hover:text-purple-600 px-2.5 py-1 rounded font-medium transition">낮은순</button>
                        </div>
                        <div id="category-ranking-list" class="space-y-2 max-h-52 overflow-y-auto pr-1 text-xs"></div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-700 text-sm mb-3"><i class="fa-solid fa-calendar-week text-purple-500 mr-1.5"></i> 주차별 지출 패턴 분석</h3>
                    <div id="weekly-pattern-container" class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs"></div>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-700 text-sm mb-3"><i class="fa-solid fa-chart-line text-purple-500 mr-1.5"></i> 전월 대비 카테고리별 지출 증감</h3>
                    <div id="mom-comparison-container" class="space-y-2 max-h-60 overflow-y-auto pr-1 text-xs"></div>
                </div>
            </section>

            <!-- 3. 전체 내역 및 검색 뷰 -->
            <section id="tab-transactions" class="space-y-4 hidden">
                <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100 space-y-3">
                    <div class="flex flex-col sm:flex-row justify-between gap-2">
                        <input type="text" id="search-keyword" placeholder="가맹점/내역 검색 (예: 렌즈, 쿠팡)..." class="text-xs border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-purple-500 w-full sm:w-72">
                        <select id="filter-category" class="text-xs border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-purple-500">
                            <option value="">모든 분류 보기</option>
                        </select>
                    </div>
                    
                    <div id="frequency-analysis-box" class="hidden p-3 bg-purple-50 border border-purple-200 rounded-xl text-xs text-purple-900 space-y-1"></div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="border-b border-gray-100 text-gray-400">
                                    <th class="py-2 px-2">거래일</th>
                                    <th class="py-2 px-2">분류</th>
                                    <th class="py-2 px-2">내역</th>
                                    <th class="py-2 px-2 text-right">금액</th>
                                    <th class="py-2 px-2">결제수단</th>
                                </tr>
                            </thead>
                            <tbody id="full-transaction-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <!-- 하단 네비게이션바 -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg py-2 px-6 flex justify-around items-center max-w-md mx-auto rounded-t-2xl z-50">
            <button onclick="switchTab('calendar')" id="nav-btn-calendar" class="flex flex-col items-center text-purple-600 font-semibold transition">
                <i class="fa-solid fa-calendar-days text-lg mb-0.5"></i>
                <span class="text-[10px]">캘린더</span>
            </button>
            <button onclick="switchTab('analytics')" id="nav-btn-analytics" class="flex flex-col items-center text-gray-400 hover:text-purple-600 transition">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
                <span class="text-[10px]">통계/인사이트</span>
            </button>
            <button onclick="switchTab('transactions')" id="nav-btn-transactions" class="flex flex-col items-center text-gray-400 hover:text-purple-600 transition">
                <i class="fa-solid fa-list-ul text-lg mb-0.5"></i>
                <span class="text-[10px]">전체내역</span>
            </button>
        </nav>
    </div>

    <!-- 하위 분류 모달 -->
    <div id="subcat-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl border border-gray-100 space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 id="modal-category-title" class="font-bold text-gray-800 text-sm">카테고리 상세</h3>
                <div class="flex items-center space-x-2">
                    <div class="space-x-1">
                        <button onclick="sortSubcatModal('desc')" class="text-[10px] bg-gray-100 hover:bg-purple-50 hover:text-purple-600 px-2 py-0.5 rounded font-medium transition">높은순</button>
                        <button onclick="sortSubcatModal('asc')" class="text-[10px] bg-gray-100 hover:bg-purple-50 hover:text-purple-600 px-2 py-0.5 rounded font-medium transition">낮은순</button>
                    </div>
                    <button onclick="closeSubcatModal()" class="text-gray-400 hover:text-gray-600 text-sm p-1 ml-2"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>
            </div>
            <div id="modal-subcat-content" class="space-y-2 max-h-80 overflow-y-auto pr-1 text-xs"></div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentYear = 2026;
        let currentMonth = 10;
        let selectedDateStr = null;
        let pieChartInstance = null;
        let currentCategoryRanking = [];
        let activeModalCategory = null;
        let modalSubcatSortOrder = 'desc';

        // 오늘 날짜 (미래 내역 필터링용)
        const TODAY_STR = '2026-09-29';

        window.addEventListener('DOMContentLoaded', async () => {
            const savedData = localStorage.getItem('weple_raw_data');
            const savedType = localStorage.getItem('weple_file_type');
            if (savedData) {
                if (savedType === 'sqlite') {
                    await parseSqliteBase64(savedData);
                } else {
                    parseCSV(savedData);
                }
                document.getElementById('upload-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                initDashboard();
            }
        });

        document.getElementById('file-input').addEventListener('change', handleFileSelect);
        document.getElementById('file-change').addEventListener('change', handleFileSelect);

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.name.endsWith('.sqlite')) {
                const reader = new FileReader();
                reader.readAsArrayBuffer(file);
                reader.onload = async function(evt) {
                    const buffer = evt.target.result;
                    const base64 = arrayBufferToBase64(buffer);
                    localStorage.setItem('weple_raw_data', base64);
                    localStorage.setItem('weple_file_type', 'sqlite');
                    
                    await parseSqliteBuffer(buffer);
                    document.getElementById('upload-screen').classList.add('hidden');
                    document.getElementById('main-dashboard').classList.remove('hidden');
                    initDashboard();
                };
            } else {
                const reader = new FileReader();
                reader.readAsText(file, 'euc-kr');
                reader.onload = function(evt) {
                    const text = evt.target.result;
                    localStorage.setItem('weple_raw_data', text);
                    localStorage.setItem('weple_file_type', 'csv');
                    
                    parseCSV(text);
                    document.getElementById('upload-screen').classList.add('hidden');
                    document.getElementById('main-dashboard').classList.remove('hidden');
                    initDashboard();
                };
            }
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        }

        async function parseSqliteBase64(base64) {
            const buffer = base64ToArrayBuffer(base64);
            await parseSqliteBuffer(buffer);
        }

        async function parseSqliteBuffer(buffer) {
            const SQL = await initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            });
            const db = new SQL.Database(new Uint8Array(buffer));
            
            const query = `
                SELECT 
                    t.ZDEALDATESTRING as 거래일,
                    t.ZAMOUNT as 금액,
                    t.ZDEPOSIT as 수입여부,
                    c.ZNAME as 분류,
                    sub.ZNAME as 하위분류,
                    t.ZTEXT as 내역,
                    card.ZNAME as 카드
                FROM ZABSTRACTSTATEMENT t
                LEFT JOIN ZICATEGORY c ON t.ZCATEGORYKEY = c.Z_PK
                LEFT JOIN ZICATEGORY sub ON t.ZSUBCATEGORYKEY = sub.Z_PK
                LEFT JOIN ZCARD card ON t.ZCARDKEY = card.Z_PK
                WHERE t.ZDELETEDMARK IS NULL OR t.ZDELETEDMARK = 0
            `;
            
            const stmt = db.prepare(query);
            allData = [];
            while (stmt.step()) {
                const row = stmt.getAsObject();
                const isDeposit = row.수입여부 === 1;
                allData.push({
                    거래일: row.거래일 || '',
                    수입지출: isDeposit ? '수입' : '지출',
                    금액: row.금액 || 0,
                    분류: cleanText(row.분류) || '미분류',
                    하위분류: cleanText(row.하위분류),
                    내역: cleanText(row.내역) || '',
                    지불: isDeposit ? '현금' : '카드',
                    카드: cleanText(row.카드) || '기본'
                });
            }
            stmt.free();

            if (allData.length > 0) {
                const dates = allData.map(d => d.거래일).filter(d => d && d.length >= 7).sort();
                if (dates.length > 0) {
                    const latest = dates[dates.length - 1];
                    const parts = latest.split('-');
                    const latestY = parseInt(parts[0]);
                    const latestM = parseInt(parts[1]);
                    const latestD = parseInt(parts[2]);
                    
                    currentYear = latestY;
                    currentMonth = latestD >= 25 ? latestM : (latestM === 1 ? 12 : latestM - 1);
                }
            }
        }

        function cleanText(text) {
            if (!text || text === 'NaN') return '기타';
            return text.replace(/ert\{[^}]*\}/g, '').trim() || '기타';
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            allData = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = parseCSVRow(lines[i]);
                if (row.length >= headers.length) {
                    allData.push({
                        사용자: row[0],
                        거래일: row[1]?.trim(),
                        수입지출: row[2]?.trim(),
                        금액: parseInt(row[3]?.replace(/,/g, '').trim()) || 0,
                        분류: cleanText(row[4]) || '미분류',
                        하위분류: cleanText(row[5]),
                        내역: cleanText(row[6]) || '',
                        지불: row[7]?.trim(),
                        카드: row[8]?.trim(),
                        메모: row[9]?.trim()
                    });
                }
            }

            if (allData.length > 0) {
                const dates = allData.map(d => d.거래일).filter(d => d && d.length >= 7).sort();
                if (dates.length > 0) {
                    const latest = dates[dates.length - 1];
                    const parts = latest.split('-');
                    const latestY = parseInt(parts[0]);
                    const latestM = parseInt(parts[1]);
                    const latestD = parseInt(parts[2]);
                    
                    currentYear = latestY;
                    currentMonth = latestD >= 25 ? latestM : (latestM === 1 ? 12 : latestM - 1);
                }
            }
        }

        function parseCSVRow(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result;
        }

        // 위플머니 사이클 월 판정 (전월 25일 ~ 당월 24일)
        function getWepleCycleMonth(dateStr) {
            if (!dateStr || dateStr.length < 10) return { y: 0, m: 0 };
            const parts = dateStr.split('-');
            let y = parseInt(parts[0]);
            let m = parseInt(parts[1]);
            let d = parseInt(parts[2]);

            if (d >= 25) {
                m += 1;
                if (m > 12) { m = 1; y += 1; }
            }
            return { y, m };
        }

        function isDateInCurrentCycle(dateStr) {
            const cycle = getWepleCycleMonth(dateStr);
            return cycle.y === currentYear && cycle.m === currentMonth;
        }

        // 미래 내역 필터링 (오늘 날짜 이후는 제외)
        function isNotFuture(dateStr) {
            return dateStr <= TODAY_STR;
        }

        function initDashboard() {
            updateMonthHeader();
            renderCalendar();
            populateCategoryFilter();
            renderAnalytics();
            renderTransactionsTable();
            
            selectDate(TODAY_STR);
        }

        document.getElementById('prev-month').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            updateMonthHeader();
            renderCalendar();
            renderAnalytics();
            renderTransactionsTable();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            updateMonthHeader();
            renderCalendar();
            renderAnalytics();
            renderTransactionsTable();
        });

        function updateMonthHeader() {
            document.getElementById('current-month-title').innerText = `${currentMonth}월`;
            
            // 사이클 내역 중 미래 내역 제외
            const monthFiltered = allData.filter(d => {
                if (!d.거래일) return false;
                return isDateInCurrentCycle(d.거래일) && isNotFuture(d.거래일);
            });

            const income = monthFiltered.filter(d => d.수입지출 === '수입').reduce((sum, d) => sum + Math.abs(d.금액), 0);
            const expense = monthFiltered.filter(d => d.수입지출 === '지출').reduce((sum, d) => sum + Math.abs(d.금액), 0);
            const balance = income - expense;

            document.getElementById('summary-income').innerText = income.toLocaleString() + '원';
            document.getElementById('summary-expense').innerText = expense.toLocaleString() + '원';
            document.getElementById('summary-balance').innerText = balance.toLocaleString() + '원';
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // 10월 캘린더뷰여도 9월 25일이 포함된 첫 주차부터 보이도록 렌더링
            // 당월 1일의 요일 인덱스
            const firstDayIndex = new Date(currentYear, currentMonth - 1, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth, 0).getDate();

            // 전월 말일
            const prevLastDay = new Date(currentYear, currentMonth - 1, 0).getDate();

            const dailyMap = {};
            allData.forEach(d => {
                if (!d.거래일) return;
                const [y, m, day] = d.거래일.split('-').map(Number);
                if (y === currentYear && m === currentMonth) {
                    if (!dailyMap[day]) dailyMap[day] = { income: 0, expense: 0 };
                    if (d.수입지출 === '수입') dailyMap[day].income += Math.abs(d.금액);
                    if (d.수입지출 === '지출') dailyMap[day].expense += Math.abs(d.금액);
                }
            });

            // 9월 25일이 포함된 주차를 보여주기 위해 일요일 시작 기준으로 앞서 빈 칸 채우기 또는 전월 25~31일 표시
            // 만약 firstDayIndex가 일요일(0)이 아니라면, 전월 25일부터 시작하도록 칸 구성
            let startDayNum = prevLastDay - firstDayIndex + 1;
            
            // 전월 25일부터 말일까지 선행 표시
            for (let i = 0; i < firstDayIndex; i++) {
                const pDay = startDayNum + i;
                let prevM = currentMonth - 1;
                let prevY = currentYear;
                if (prevM < 1) { prevM = 12; prevY--; }
                const dateStr = `${prevY}-${String(prevM).padStart(2, '0')}-${String(pDay).padStart(2, '0')}`;
                
                // 전월 데이터 집계 확인
                let pIncome = 0, pExpense = 0;
                allData.forEach(d => {
                    if (d.거래일 === dateStr) {
                        if (d.수입지출 === '수입') pIncome += Math.abs(d.금액);
                        if (d.수입지출 === '지출') pExpense += Math.abs(d.금액);
                    }
                });

                grid.innerHTML += `
                    <div onclick="selectDate('${dateStr}')" class="p-1 h-20 bg-gray-50/70 hover:bg-teal-50 rounded-lg cursor-pointer transition flex flex-col justify-between border border-transparent hover:border-teal-300 ${selectedDateStr === dateStr ? 'ring-2 ring-teal-500 bg-teal-50/60' : ''}">
                        <div class="text-right text-xs font-medium text-gray-400">${pDay}</div>
                        <div class="text-[9px] space-y-0.5 overflow-hidden">
                            ${pIncome > 0 ? `<div class="text-emerald-600 font-semibold truncate">+${formatShort(pIncome)}</div>` : ''}
                            ${pExpense > 0 ? `<div class="text-pink-500 font-semibold truncate">-${formatShort(pExpense)}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            // 당월 1일 ~ 말일 채우기
            for (let day = 1; day <= lastDay; day++) {
                const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const data = dailyMap[day] || { income: 0, expense: 0 };
                
                grid.innerHTML += `
                    <div onclick="selectDate('${dateStr}')" class="p-1 h-20 bg-gray-50 hover:bg-teal-50 rounded-lg cursor-pointer transition flex flex-col justify-between border border-transparent hover:border-teal-300 ${selectedDateStr === dateStr ? 'ring-2 ring-teal-500 bg-teal-50/60' : ''}">
                        <div class="text-right text-xs font-medium text-gray-700">${day}</div>
                        <div class="text-[9px] space-y-0.5 overflow-hidden">
                            ${data.income > 0 ? `<div class="text-emerald-600 font-semibold truncate">+${formatShort(data.income)}</div>` : ''}
                            ${data.expense > 0 ? `<div class="text-pink-500 font-semibold truncate">-${formatShort(data.expense)}</div>` : ''}
                        </div>
                    </div>
                `;
            }
        }

        function formatShort(amount) {
            if (amount >= 10000) return (amount / 10000).toFixed(1) + '만';
            return amount.toLocaleString();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();

            const parts = dateStr.split('-');
            document.getElementById('selected-date-title').innerText = `${parseInt(parts[1])}월 ${parseInt(parts[2])}일 상세 내역`;

            const dayTransactions = allData.filter(item => item.거래일 === dateStr);
            const totalExp = dayTransactions.filter(item => item.수입지출 === '지출').reduce((sum, item) => sum + Math.abs(item.금액), 0);
            document.getElementById('selected-date-summary').innerText = `지출 합계: ${totalExp.toLocaleString()}원`;

            const container = document.getElementById('selected-date-transactions');
            if (dayTransactions.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">이 날의 거래 내역이 없습니다.</p>`;
                return;
            }

            container.innerHTML = dayTransactions.map(item => `
                <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl hover:bg-teal-50/40 transition">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs px-2 py-1 rounded-md bg-white border border-gray-200 text-teal-700 font-medium">${item.분류}</span>
                        <div>
                            <div class="text-xs font-bold text-gray-800">${item.내역 || '기타'}</div>
                            <div class="text-[10px] text-gray-400">${item.지불 || ''} / ${item.카드 || ''}</div>
                        </div>
                    </div>
                    <div class="text-xs font-bold ${item.수입지출 === '수입' ? 'text-emerald-600' : 'text-pink-500'}">
                        ${item.수입지출 === '수입' ? '+' : '-'}${Math.abs(item.금액).toLocaleString()}원
                    </div>
                </div>
            `).join('');
        }

        function renderAnalytics() {
            const monthFiltered = allData.filter(d => {
                if (!d.거래일 || d.수입지출 !== '지출') return false;
                return isDateInCurrentCycle(d.거래일) && isNotFuture(d.거래일);
            });

            const categoryMap = {};
            monthFiltered.forEach(d => {
                categoryMap[d.분류] = (categoryMap[d.분류] || 0) + Math.abs(d.금액);
            });

            currentCategoryRanking = Object.entries(categoryMap).map(([cat, amount]) => ({ cat, amount }));
            sortCategoryList('desc');

            const labels = currentCategoryRanking.map(i => i.cat);
            const dataVals = currentCategoryRanking.map(i => i.amount);

            if (pieChartInstance) pieChartInstance.destroy();

            const ctx = document.getElementById('categoryPieChart').getContext('2d');
            pieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataVals,
                        backgroundColor: ['#a78bfa', '#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb7185', '#facc15', '#4ade80', '#94a3b8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                    }
                }
            });

            renderWeeklyPattern(monthFiltered);
            renderMoMComparison(monthFiltered);
        }

        function renderWeeklyPattern(monthFiltered) {
            const container = document.getElementById('weekly-pattern-container');
            let prevM = currentMonth - 1;
            let prevY = currentYear;
            if (prevM < 1) { prevM = 12; prevY--; }
            const startDate = new Date(`${prevY}-${String(prevM).padStart(2, '0')}-25`);

            const weeks = { '1주차(25~31일)': 0, '2주차(1~7일)': 0, '3주차(8~14일)': 0, '4주차(15~21일)': 0, '5주차(22일~)': 0 };

            monthFiltered.forEach(d => {
                const dDate = new Date(d.거래일);
                const diffDays = Math.floor((dDate - startDate) / (1000 * 60 * 60 * 24));
                if (diffDays <= 6) weeks['1주차(25~31일)'] += Math.abs(d.금액);
                else if (diffDays <= 13) weeks['2주차(1~7일)'] += Math.abs(d.금액);
                else if (diffDays <= 20) weeks['3주차(8~14일)'] += Math.abs(d.금액);
                else if (diffDays <= 27) weeks['4주차(15~21일)'] += Math.abs(d.금액);
                else weeks['5주차(22일~)'] += Math.abs(d.금액);
            });

            const total = Object.values(weeks).reduce((a, b) => a + b, 0);

            container.innerHTML = Object.entries(weeks).map(([wName, amount]) => {
                const pct = total > 0 ? ((amount / total) * 100).toFixed(1) : 0;
                return `
                    <div class="p-2.5 bg-gray-50 rounded-xl space-y-1 text-center">
                        <div class="font-bold text-gray-600">${wName}</div>
                        <div class="text-purple-700 font-extrabold">${amount.toLocaleString()}원</div>
                        <div class="text-[10px] text-gray-400">${pct}%</div>
                    </div>
                `;
            }).join('');
        }

        function renderMoMComparison(currentMonthFiltered) {
            const container = document.getElementById('mom-comparison-container');
            
            let prevY = currentYear;
            let prevM = currentMonth - 1;
            if (prevM < 1) { prevM = 12; prevY--; }

            const prevMonthFiltered = allData.filter(d => {
                if (!d.거래일 || d.수입지출 !== '지출') return false;
                const cycle = getWepleCycleMonth(d.거래일);
                return cycle.y === prevY && cycle.m === prevM && isNotFuture(d.거래일);
            });

            const currentMap = {};
            currentMonthFiltered.forEach(d => { currentMap[d.분류] = (currentMap[d.분류] || 0) + Math.abs(d.금액); });

            const prevMap = {};
            prevMonthFiltered.forEach(d => { prevMap[d.분류] = (prevMap[d.분류] || 0) + Math.abs(d.금액); });

            const allCats = [...new Set([...Object.keys(currentMap), ...Object.keys(prevMap)])];
            if (allCats.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-4">비교할 지난달 데이터가 없습니다.</p>`;
                return;
            }

            const comparison = allCats.map(cat => {
                const cur = currentMap[cat] || 0;
                const prev = prevMap[cat] || 0;
                const diff = cur - prev;
                return { cat, cur, prev, diff };
            }).sort((a, b) => b.cur - a.cur);

            container.innerHTML = comparison.map(item => {
                const sign = item.diff > 0 ? '+' : '';
                const color = item.diff > 0 ? 'text-pink-500' : (item.diff < 0 ? 'text-emerald-600' : 'text-gray-400');
                return `
                    <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl">
                        <div>
                            <span class="font-bold text-gray-800">${item.cat}</span>
                            <div class="text-[10px] text-gray-400">지난달: ${item.prev.toLocaleString()}원</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-gray-800">${item.cur.toLocaleString()}원</div>
                            <div class="text-[10px] font-semibold ${color}">${sign}${item.diff.toLocaleString()}원</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function sortCategoryList(order) {
            if (order === 'desc') {
                currentCategoryRanking.sort((a, b) => b.amount - a.amount);
            } else {
                currentCategoryRanking.sort((a, b) => a.amount - b.amount);
            }

            const container = document.getElementById('category-ranking-list');
            const total = currentCategoryRanking.reduce((acc, cur) => acc + cur.amount, 0);

            container.innerHTML = currentCategoryRanking.map((item, idx) => {
                const pct = total > 0 ? ((item.amount / total) * 100).toFixed(1) : 0;
                return `
                    <div onclick="openSubcatModal('${item.cat}')" class="flex justify-between items-center p-2.5 bg-gray-50 hover:bg-purple-50/60 rounded-xl cursor-pointer transition">
                        <div class="flex items-center space-x-2">
                            <span class="w-5 text-gray-400 font-bold">${idx + 1}</span>
                            <span class="font-semibold text-gray-700 underline decoration-dotted underline-offset-4">${item.cat}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-gray-400 text-[10px]">${pct}%</span>
                            <span class="font-bold text-gray-800">${item.amount.toLocaleString()}원</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openSubcatModal(categoryName) {
            activeModalCategory = categoryName;
            modalSubcatSortOrder = 'desc';
            document.getElementById('modal-category-title').innerText = `'${categoryName}' 하위 분류 상세`;
            renderSubcatModalContent();
            document.getElementById('subcat-modal').classList.remove('hidden');
        }

        function sortSubcatModal(order) {
            modalSubcatSortOrder = order;
            renderSubcatModalContent();
        }

        function renderSubcatModalContent() {
            const categoryName = activeModalCategory;
            const monthFiltered = allData.filter(d => {
                if (!d.거래일 || d.수입지출 !== '지출' || d.분류 !== categoryName) return false;
                return isDateInCurrentCycle(d.거래일) && isNotFuture(d.거래일);
            });

            const subcatMap = {};
            monthFiltered.forEach(d => {
                const sub = d.하위분류 || '기타';
                if (!subcatMap[sub]) subcatMap[sub] = { total: 0, items: [] };
                subcatMap[sub].total += Math.abs(d.금액);
                subcatMap[sub].items.push(d);
            });

            const sortedSubs = Object.entries(subcatMap).sort((a, b) => {
                return modalSubcatSortOrder === 'desc' ? b[1].total - a[1].total : a[1].total - b[1].total;
            });

            const contentContainer = document.getElementById('modal-subcat-content');

            if (sortedSubs.length === 0) {
                contentContainer.innerHTML = `<p class="text-center text-gray-400 py-6">해당 카테고리의 지출 내역이 없습니다.</p>`;
            } else {
                contentContainer.innerHTML = sortedSubs.map(([subName, data]) => `
                    <div class="p-3 bg-gray-50 rounded-xl space-y-2">
                        <div class="flex justify-between font-bold text-gray-800 border-b border-gray-200 pb-1.5">
                            <span>${subName}</span>
                            <span class="text-purple-600">${data.total.toLocaleString()}원</span>
                        </div>
                        <div class="space-y-1">
                            ${data.items.map(i => `
                                <div class="flex justify-between text-[11px] text-gray-500">
                                    <span>${i.거래일.slice(5)} \vert{} ${i.내역 || '기타'}</span>
                                    <span class="font-medium text-gray-700">${Math.abs(i.금액).toLocaleString()}원</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }
        }

        function closeSubcatModal() {
            document.getElementById('subcat-modal').classList.add('hidden');
        }

        function populateCategoryFilter() {
            const categories = [...new Set(allData.map(d => d.분류))].sort();
            const select = document.getElementById('filter-category');
            select.innerHTML = '<option value="">모든 분류 보기</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        document.getElementById('search-keyword').addEventListener('input', renderTransactionsTable);
        document.getElementById('filter-category').addEventListener('change', renderTransactionsTable);

        function renderTransactionsTable() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase().trim();
            const catFilter = document.getElementById('filter-category').value;
            const freqBox = document.getElementById('frequency-analysis-box');

            const filtered = allData.filter(d => {
                const matchCycle = isDateInCurrentCycle(d.거래일) && isNotFuture(d.거래일);
                const matchKeyword = (d.내역 && d.내역.toLowerCase().includes(keyword)) || (d.카드 && d.카드.toLowerCase().includes(keyword));
                const matchCat = !catFilter || d.분류 === catFilter;
                return matchCycle && matchKeyword && matchCat;
            });

            if (keyword.length > 0) {
                const keywordAllMatches = allData.filter(d => {
                    return d.수입지출 === '지출' && isNotFuture(d.거래일) && ((d.내역 && d.내역.toLowerCase().includes(keyword)) || (d.카드 && d.카드.toLowerCase().includes(keyword)));
                }).sort((a, b) => new Date(a.거래일) - new Date(b.거래일));

                if (keywordAllMatches.length >= 2) {
                    let totalDays = 0;
                    for (let i = 1; i < keywordAllMatches.length; i++) {
                        const d1 = new Date(keywordAllMatches[i-1].거래일);
                        const d2 = new Date(keywordAllMatches[i].거래일);
                        totalDays += Math.abs(d2 - d1) / (1000 * 60 * 60 * 24);
                    }
                    const avgInterval = Math.round(totalDays / (keywordAllMatches.length - 1));
                    const lastDate = new Date(keywordAllMatches[keywordAllMatches.length - 1].거래일);
                    const today = new Date(TODAY_STR);
                    const diffFromLast = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));

                    freqBox.classList.remove('hidden');
                    freqBox.innerHTML = `
                        <div class="font-bold"><i class="fa-solid fa-rotate mr-1"></i> '${keyword}' 소비 주기 분석</div>
                        <div>총 ${keywordAllMatches.length}회 구매 | 평균 약 <b>${avgInterval}일</b> 주기로 소비하고 있습니다. (마지막 구매일로부터 ${diffFromLast}일 경과)</div>
                    `;
                } else {
                    freqBox.classList.add('hidden');
                }
            } else {
                freqBox.classList.add('hidden');
            }

            const tbody = document.getElementById('full-transaction-tbody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-400">조건에 맞는 내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                    <td class="py-2.5 px-2 text-gray-500">${item.거래일}</td>
                    <td class="py-2.5 px-2"><span class="px-2 py-0.5 bg-purple-50 text-purple-700 rounded text-[10px] font-medium">${item.분류}</span></td>
                    <td class="py-2.5 px-2 font-medium text-gray-800">${item.내역 || '-'}</td>
                    <td class="py-2.5 px-2 text-right font-bold ${item.수입지출 === '수입' ? 'text-emerald-600' : 'text-pink-500'}">${item.수입지출 === '수입' ? '+' : '-'}${Math.abs(item.금액).toLocaleString()}원</td>
                    <td class="py-2.5 px-2 text-gray-400 text-[10px]">${item.카드 || ''}</td>
                </tr>
            `).join('');
        }

        function switchTab(tabName) {
            document.getElementById('tab-calendar').classList.add('hidden');
            document.getElementById('tab-analytics').classList.add('hidden');
            document.getElementById('tab-transactions').classList.add('hidden');

            document.getElementById('nav-btn-calendar').className = "flex flex-col items-center text-gray-400 hover:text-purple-600 transition";
            document.getElementById('nav-btn-analytics').className = "flex flex-col items-center text-gray-400 hover:text-purple-600 transition";
            document.getElementById('nav-btn-transactions').className = "flex flex-col items-center text-gray-400 hover:text-purple-600 transition";

            if (tabName === 'calendar') {
                document.getElementById('tab-calendar').classList.remove('hidden');
                document.getElementById('nav-btn-calendar').className = "flex flex-col items-center text-purple-600 font-semibold transition";
            } else if (tabName === 'analytics') {
                document.getElementById('tab-analytics').classList.remove('hidden');
                document.getElementById('nav-btn-analytics').className = "flex flex-col items-center text-purple-600 font-semibold transition";
            } else if (tabName === 'transactions') {
                document.getElementById('tab-transactions').classList.remove('hidden');
                document.getElementById('nav-btn-transactions').className = "flex flex-col items-center text-purple-600 font-semibold transition";
            }
        }
    </script>
</body>
</html>
